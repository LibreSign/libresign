services:
  nextcloud:
    volumes:
      - ../:/var/www/html/apps-extra/libresign
  nginx:
    volumes:
      - ../:/var/www/html/apps-extra/libresign:ro
  playwright:
    # Keep the browser image aligned with the version installed by npm ci.
    # NCDD's default image is shared and may target a different Playwright.
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    volumes:
      - ../:/var/www/html/apps-extra/libresign
