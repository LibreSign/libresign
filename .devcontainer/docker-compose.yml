include:
  - path: ./.nextcloud-docker-development/docker-compose.yml
    project_directory: ./.nextcloud-docker-development
    env_file: ./.nextcloud-docker-development/.env

services:
  nextcloud:
    volumes:
      - ../:/var/www/html/apps-extra/libresign
  nginx:
    volumes:
      - ../:/var/www/html/apps-extra/libresign:ro
  playwright:
    volumes:
      - ../:/var/www/html/apps-extra/libresign
