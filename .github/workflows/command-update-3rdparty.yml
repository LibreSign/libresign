name: Update 3rdparty PR reference

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  update-submodule:
    if: github.event.issue.pull_request != '' && github.event.comment.body == '/update-3rdparty'
    runs-on: ubuntu-latest
    steps:
      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      # No PR checkout: a comment-triggered workflow has privileged credentials.
      - name: Update submodule through GitHub API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.COMMAND_BOT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

            if (pr.state !== 'open' ||
                pr.head.repo?.full_name !== owner + '/' + repo ||
                !/^(main|stable\d+)$/.test(pr.base.ref)) {
              throw new Error('Only open PRs from this repository targeting main/stable are supported');
            }

            const match = (pr.body || '').match(
              /^\s*-\s*\[[ xX]\]\s*3rdparty:\s*https:\/\/github\.com\/LibreSign\/3rdparty\/pull\/(\d+)\s*$/m
            );
            if (!match) {
              throw new Error('PR body must link the originating LibreSign/3rdparty PR');
            }
            const sourcePrNumber = Number(match[1]);
            const { data: source } = await github.rest.pulls.get({
              owner: 'LibreSign', repo: '3rdparty', pull_number: sourcePrNumber,
            });
            if (!source.merged_at || !source.merge_commit_sha ||
                source.base.ref !== pr.base.ref) {
              throw new Error('The linked 3rdparty PR must be merged into the same target branch');
            }

            const { data: head } = await github.rest.git.getCommit({
              owner, repo, commit_sha: pr.head.sha,
            });
            const { data: currentTree } = await github.rest.git.getTree({
              owner, repo, tree_sha: head.tree.sha,
            });
            const gitlink = currentTree.tree.find((entry) =>
              entry.path === '3rdparty' && entry.mode === '160000');
            if (!gitlink) {
              throw new Error('The LibreSign PR does not contain the 3rdparty submodule');
            }
            if (gitlink.sha === source.merge_commit_sha) {
              core.notice('The 3rdparty submodule already points to the merged commit');
              return;
            }

            const { data: tree } = await github.rest.git.createTree({
              owner, repo, base_tree: head.tree.sha,
              tree: [{
                path: '3rdparty', mode: '160000', type: 'commit',
                sha: source.merge_commit_sha,
              }],
            });
            const author = {
              name: 'libresign-command',
              email: 'libresign-command@users.noreply.github.com',
            };
            const message = 'chore(deps): update 3rdparty from merged PR #' +
              sourcePrNumber + '\n\nSigned-off-by: ' +
              author.name + ' <' + author.email + '>';
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, message, tree: tree.sha, parents: [pr.head.sha],
              author, committer: author,
            });
            // Never overwrite a PR branch that moved during this workflow.
            await github.rest.git.updateRef({
              owner, repo, ref: 'heads/' + pr.head.ref,
              sha: commit.sha, force: false,
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: pull_number,
              body: 'Updated 3rdparty to LibreSign/3rdparty#' +
                sourcePrNumber + ' (' + source.merge_commit_sha + ').',
            });
