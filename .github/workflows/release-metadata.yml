name: Release metadata
on:
  pull_request:
    paths:
      - '.nextcloud-release.yml'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/changelogs/**'
      - 'scripts/release-metadata.mjs'
      - 'tests/release-metadata.test.mjs'
      - 'Makefile'
  push:
    branches:
      - main
      - 'stable*'
    paths:
      - '.nextcloud-release.yml'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/changelogs/**'
      - 'scripts/release-metadata.mjs'
      - 'tests/release-metadata.test.mjs'
      - 'Makefile'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release metadata mapping
        run: node --test tests/release-metadata.test.mjs
      - name: Verify current release metadata
        run: make verify-release-metadata
      - name: Verify changelog selection
        run: test "$(make -s print-release-changelog)" = "docs/changelogs/changelog-16.md"
