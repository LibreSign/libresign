name: Release metadata
on:
  pull_request:
    paths:
      - '.nextcloud-release.yml'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/changelogs/**'
      - 'Makefile'
  push:
    branches:
      - main
      - 'stable*'
    paths:
      - '.nextcloud-release.yml'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/changelogs/**'
      - 'Makefile'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: release-tool
        name: Setup release-tool
        uses: LibreCodeCoop/github-workflows/actions/setup-release-tool@487d9a999c576df09fe292092cee5c8efe2abb05
      - name: Validate release-tool consumer configuration
        env:
          RELEASE_TOOL_PATH: ${{ steps.release-tool.outputs.path }}
        run: php "${RELEASE_TOOL_PATH}" config:validate --config .nextcloud-release.yml --root .
      - name: Validate current release metadata
        env:
          RELEASE_TOOL_PATH: ${{ steps.release-tool.outputs.path }}
        run: php "${RELEASE_TOOL_PATH}" metadata:inspect --config .nextcloud-release.yml --root . --ref HEAD --json
      - name: Verify packaging changelog mapping
        run: |
          make verify-release-metadata
          test "$(make -s print-release-changelog)" = "docs/changelogs/changelog-16.md"
