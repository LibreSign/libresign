name: Release metadata
on:
  pull_request:
    paths:
      - '.nextcloud-release.yml'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/changelogs/**'
      - 'Makefile'
      - 'tests/ci/test-release-makefile.sh'
  push:
    branches:
      - main
      - 'stable*'
    paths:
      - '.nextcloud-release.yml'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/changelogs/**'
      - 'Makefile'
      - 'tests/ci/test-release-makefile.sh'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: release
        name: Validate release consumer
        uses: LibreCodeCoop/release-tool/actions/metadata-inspect@385ca7732db12e5c79590bb21be8da3608194595
        with:
          config-path: .nextcloud-release.yml
          root: .
          ref: HEAD

      - name: Verify packaging changelog mapping
        env:
          EXPECTED_CHANGELOG: ${{ steps.release.outputs.changelog-path }}
        run: test "$(make -s print-release-changelog)" = "${EXPECTED_CHANGELOG}"

      - name: Verify release packaging recipe
        run: bash tests/ci/test-release-makefile.sh
