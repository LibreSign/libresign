name: Release metadata
on:
  pull_request:
    paths:
      - '.nextcloud-release.yml'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/changelogs/**'
      - 'Makefile'
  push:
    branches:
      - main
      - 'stable*'
    paths:
      - '.nextcloud-release.yml'
      - 'appinfo/info.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/changelogs/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.3 for release-tool
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - id: release-tool
        name: Setup release-tool v0.11.0
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/LibreCodeCoop/release-tool/releases/download/v0.11.0"
          curl --fail --silent --show-error --location "${base}/release-tool.phar" -o "${RUNNER_TEMP}/release-tool.phar"
          curl --fail --silent --show-error --location "${base}/release-tool.phar.sha256" -o "${RUNNER_TEMP}/release-tool.phar.sha256"
          (cd "${RUNNER_TEMP}" && sha256sum --check release-tool.phar.sha256)
          echo "path=${RUNNER_TEMP}/release-tool.phar" >> "${GITHUB_OUTPUT}"

      - id: release
        name: Validate release consumer
        shell: bash
        env:
          RELEASE_TOOL_PATH: ${{ steps.release-tool.outputs.path }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/release-metadata.json"
          php "${RELEASE_TOOL_PATH}" metadata:inspect \
            --config .nextcloud-release.yml \
            --root . \
            --ref HEAD \
            --json > "${metadata}"
          changelog="$(php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $m["changelog_path"];' "${metadata}")"
          echo "changelog-path=${changelog}" >> "${GITHUB_OUTPUT}"

      - name: Verify packaging changelog mapping
        env:
          EXPECTED_CHANGELOG: ${{ steps.release.outputs.changelog-path }}
        run: test "$(make -s print-release-changelog)" = "${EXPECTED_CHANGELOG}"
