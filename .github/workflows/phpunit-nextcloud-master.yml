name: PHPUnit Nextcloud master

on:
  pull_request:
    paths:
      - '.github/workflows/phpunit-nextcloud-master.yml'
      - 'appinfo/**'
      - 'lib/**'
      - 'tests/**'
      - '3rdparty/**'
      - 'vendor-bin/**'
      - 'composer.json'
      - 'composer.lock'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phpunit-nextcloud-master-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  phpunit-nextcloud-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nextcloud master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: master

      - name: Checkout LibreSign
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          path: apps/libresign

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite, imagick
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y poppler-utils

      - name: Remove nextcloud/ocp
        working-directory: apps/libresign
        run: composer remove nextcloud/ocp --dev --no-scripts

      - name: Install LibreSign dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: apps/libresign

      - name: Install Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose \
            --database=sqlite \
            --database-name=nextcloud \
            --admin-user=admin \
            --admin-pass=admin
          ./occ app:enable --force libresign
          ./occ config:app:set dav enableDefaultContact --value false --type boolean

      - name: Run LibreSign unit tests
        working-directory: apps/libresign
        run: composer run test:unit

      - name: Print Nextcloud log
        if: always()
        run: cat data/nextcloud.log || true
