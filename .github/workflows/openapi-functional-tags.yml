name: OpenAPI functional tags

on: pull_request

permissions:
  contents: read

concurrency:
  group: openapi-functional-tags-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check functional tags
        run: php tests/openapi/check-functional-tags.php
