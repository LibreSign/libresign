name: Behat MariaDB

on: pull_request

permissions:
  contents: read

concurrency:
  group: behat-mariadb-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-version: ${{ steps.versions.outputs.php-available-list }}
      server-max: ${{ steps.versions.outputs.branches-max-list }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3.3.1.3.3

  changes:
    runs-on: ubuntu-latest

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/behat*'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - '3rdparty/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'

  behat-mariadb:
    runs-on: ubuntu-latest

    needs: [changes, matrix]
    if: needs.changes.outputs.src != 'false'

    strategy:
      matrix:
        php-versions: ${{ fromJson(needs.matrix.outputs.php-version) }}
        server-versions: ${{ fromJson(needs.matrix.outputs.server-max) }}
        mariadb-versions: ['10.6', '10.11']

    name: MariaDB ${{ matrix.mariadb-versions }} PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    services:
      mariadb:
        image: ghcr.io/nextcloud/continuous-integration-mariadb-${{ matrix.mariadb-versions }}:latest
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025/tcp
          - 1025:1025/tcp

    steps:
      - name: Set app env
        run: |
          # Split and keep last
          echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Install system and PHP crash diagnostics
        run: |
          sudo apt update
          sudo apt install -y poppler-utils gdb systemd-coredump lsof procps
          sudo sysctl -w kernel.core_pattern='/tmp/core.%e.%p.%t' || true
          echo "core_pattern=$(cat /proc/sys/kernel/core_pattern)"

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, mysql, pdo_mysql, imagick
          coverage: none
          ini-file: development
          # Required: re-enable pcntl_* functions that may be disabled via disable_functions
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable ONLY_FULL_GROUP_BY MariaDB option
        run: |
          echo "SET GLOBAL sql_mode=(SELECT CONCAT(@@sql_mode,',ONLY_FULL_GROUP_BY'));" | mysql -h 127.0.0.1 -P 4444 -u root -prootpassword
          echo "SELECT @@sql_mode;" | mysql -h 127.0.0.1 -P 4444 -u root -prootpassword

      - name: Set up dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer install --no-dev
          composer --working-dir=tests/integration install

      - name: Set up Nextcloud
        env:
          DB_PORT: 4444
        run: |
          sudo echo "127.0.0.1 mailpit" | sudo tee -a /etc/hosts
          mkdir data
          ./occ maintenance:install \
            --verbose \
            --database=mysql \
            --database-name=nextcloud \
            --database-host=127.0.0.1 \
            --database-port=$DB_PORT \
            --database-user=root \
            --database-pass=rootpassword \
            --admin-user admin \
            --admin-pass admin
          ./occ --version
          ./occ app:enable --force ${{ env.APP_NAME }}
          git clone --depth 1 -b ${{ matrix.server-versions }} https://github.com/nextcloud/notifications apps/notifications
          composer --working-dir=apps/notifications install --no-dev
          ./occ app:enable --force notifications
          git clone --depth 1 -b ${{ matrix.server-versions }} https://github.com/nextcloud/activity apps/activity
          composer --working-dir=apps/activity install --no-dev
          ./occ app:enable --force activity
          git clone --depth 1 -b main https://github.com/nextcloud/guests apps/guests
          composer --working-dir=apps/guests install --no-dev
          ./occ app:enable --force guests
          ./occ config:system:set allow_local_remote_servers --value true --type boolean
          ./occ config:system:set auth.bruteforce.protection.enabled --value false --type boolean
          ./occ config:system:set mail_smtphost --value mailpit
          ./occ config:system:set mail_smtpport --value 1025 --type integer
          ./occ config:system:set ratelimit.protection.enabled --value false --type boolean
          ./occ config:app:set dav enableDefaultContact --value false --type boolean

      - name: Run behat
        working-directory: apps/${{ env.APP_NAME }}/tests/integration
        env:
          BEHAT_ROOT_DIR: ../../../../
          BEHAT_RUN_AS: runner
          BEHAT_VERBOSE: '1'
        run: |
          ulimit -c unlimited
          echo "core_limit=$(ulimit -c)"
          vendor/bin/behat -f junit -f pretty --colors

      - name: Print logs
        if: always()
        run: |
          cat data/nextcloud.log

      - name: Collect PHP crash diagnostics
        if: failure()
        working-directory: apps/${{ env.APP_NAME }}/tests/integration
        run: |
          mkdir -p behat-native-diagnostics
          {
            echo "== core limit =="
            ulimit -c
            echo "== core pattern =="
            cat /proc/sys/kernel/core_pattern || true
            echo "== PHP processes =="
            ps -eo pid,ppid,pgid,sid,user,stat,etime,rss,vsz,pcpu,pmem,args | grep '[p]hp' || true
            echo "== coredumpctl list =="
            sudo coredumpctl --no-pager list || true
            echo "== coredumpctl info for php =="
            sudo coredumpctl --no-pager info php || true
            echo "== kernel messages =="
            sudo dmesg --ctime | tail -n 300 || true
          } > behat-native-diagnostics/system-state.txt 2>&1

          php_bin="$(command -v php)"
          found=0
          for core in /tmp/core.*; do
            [ -f "$core" ] || continue
            found=1
            base="$(basename "$core")"
            cp "$core" "behat-native-diagnostics/$base" || true
            gdb --batch -ex 'set pagination off' -ex 'thread apply all bt full' -ex 'info registers' -ex 'info sharedlibrary' "$php_bin" "$core" > "behat-native-diagnostics/$base.gdb.txt" 2>&1 || true
          done
          if [ "$found" -eq 0 ]; then
            echo "No direct core file found in /tmp." > behat-native-diagnostics/no-direct-core.txt
          fi

          sudo timeout 20s coredumpctl --no-pager --quiet debug php --debugger-arguments="-batch -ex 'set pagination off' -ex 'thread apply all bt full' -ex 'info registers' -ex 'info sharedlibrary'" > behat-native-diagnostics/coredumpctl-gdb.txt 2>&1 || true

      - name: Upload PHP server diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behat-mariadb-server-diagnostics-${{ matrix.mariadb-versions }}-php${{ matrix.php-versions }}-nc${{ matrix.server-versions }}
          path: |
            /tmp/behat-php-server-*
            /tmp/core.*
            apps/${{ env.APP_NAME }}/tests/integration/behat-native-diagnostics/
          if-no-files-found: warn

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, behat-mariadb]

    if: always()

    name: behat-mariadb-summary

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.behat-mariadb.result != 'success' }}; then exit 1; fi
