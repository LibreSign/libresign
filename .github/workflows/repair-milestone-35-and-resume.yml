name: Repair milestone 35 and resume release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-milestone-35-and-resume.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  repair-and-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Next Patch (35) milestone is open
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          milestones="$(gh api --method GET --paginate "repos/${REPOSITORY}/milestones?state=all&per_page=100" | jq -s 'add')"
          milestone="$(jq -c '[.[] | select(.title == "Next Patch (35)")] | first // empty' <<<"${milestones}")"
          if [[ -z "${milestone}" ]]; then
            gh api --method POST "repos/${REPOSITORY}/milestones" \
              -f title='Next Patch (35)' \
              -f state='open' >/dev/null
          else
            number="$(jq -r '.number' <<<"${milestone}")"
            state="$(jq -r '.state' <<<"${milestone}")"
            if [[ "${state}" != "open" ]]; then
              gh api --method PATCH "repos/${REPOSITORY}/milestones/${number}" \
                -f state='open' >/dev/null
            fi
          fi

      - name: Dispatch release resume
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/resume-release.yml/dispatches" \
            --data '{"ref":"main","inputs":{"pull_request_number":"8854"}}'
