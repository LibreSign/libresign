# This workflow will update all workflow templates.
# Additionally it will reapply workflow.yml.patch files after syncing and only then commit the result.
#
# Authentication is selected explicitly with vars.WORKFLOW_SYNC_AUTH_MODE.
# See docs/cross-repository-automation.md for modes, credentials and GITHUB_TOKEN limitations.
name: Update workflows
on:
  workflow_dispatch:
  schedule:
      - cron: "5 2 * * 0"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branches:
          - ${{ github.event.repository.default_branch }}
          - stable35
          - stable34
          - stable33

    name: Update workflows in ${{ matrix.branches }}

    permissions:
      contents: write
      pull-requests: write

    env:
      AUTH_MODE: ${{ vars.WORKFLOW_SYNC_AUTH_MODE || 'github-app' }}

    steps:
      - name: Check actor permission
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq '.permission')"
          [[ "${permission}" == "admin" ]] || {
            echo "::error::Manual workflow runs require repository admin permission; ${GITHUB_ACTOR} has ${permission}"
            exit 1
          }

      - name: Validate workflow sync authentication
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.WORKFLOW_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_SYNC_APP_PRIVATE_KEY }}
          CONSUMER_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          case "${AUTH_MODE}" in
            github-app)
              [[ -n "${APP_CLIENT_ID}" && -n "${APP_PRIVATE_KEY}" ]] || {
                echo "::error::github-app requires WORKFLOW_SYNC_APP_CLIENT_ID and WORKFLOW_SYNC_APP_PRIVATE_KEY"
                exit 1
              }
              ;;
            token)
              [[ -n "${CONSUMER_TOKEN}" ]] || {
                echo "::error::token mode requires WORKFLOW_SYNC_TOKEN"
                exit 1
              }
              ;;
            github-token)
              ;;
            *)
              echo "::error::Unsupported WORKFLOW_SYNC_AUTH_MODE: ${AUTH_MODE}"
              exit 1
              ;;
          esac

      - name: Create GitHub App token
        if: ${{ env.AUTH_MODE == 'github-app' }}
        id: workflow-app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.WORKFLOW_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Resolve workflow sync token
        id: auth-token
        shell: bash
        env:
          WORKFLOW_APP_TOKEN: ${{ steps.workflow-app-token.outputs.token }}
          CONSUMER_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "${AUTH_MODE}" in
            github-app) token="${WORKFLOW_APP_TOKEN}" ;;
            token) token="${CONSUMER_TOKEN}" ;;
            github-token) token="${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac

          [[ -n "${token}" ]] || {
            echo "::error::Selected workflow sync authentication produced an empty token"
            exit 1
          }

          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          repository: LibreCodeCoop/.github

      - name: Record workflow catalog revision
        id: catalog-revision
        working-directory: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: target
          ref: ${{ matrix.branches }}

      - name: Synchronize workflow templates
        id: sync
        uses: ./source/actions/sync-workflows
        with:
          source: source/workflow-templates
          target: target
          catalog-commit: ${{ steps.catalog-revision.outputs.sha }}
          include: appstore-build-publish.yml,block-unconventional-commits.yml,command-update-submodule.yml,first-merged-pr-comment.yml,lint-eslint.yml,lint-info-xml.yml,lint-php-cs.yml,lint-stylelint.yml,lint-typescript.yml,nightly-release.yml,node-test.yml,npm-audit-fix.yml,openapi.yml,reuse.yml,sync-workflow-templates.yml

      - name: Resolve verified bot identity for synchronized workflows
        if: ${{ steps.sync.outputs.changed == 'true' }}
        id: sync-signer
        shell: bash
        env:
          MODE: ${{ env.AUTH_MODE }}
          APP_SLUG: ${{ steps.workflow-app-token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$MODE" in
            github-app)
              [[ "$APP_SLUG" =~ ^[a-zA-Z0-9-]+$ ]] || exit 1
              bot_user_id="$(gh api "users/${APP_SLUG}[bot]" --jq '.id')"
              [[ "$bot_user_id" =~ ^[0-9]+$ ]] || exit 1
              name="${APP_SLUG}[bot]"
              email="${bot_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
              ;;
            github-token)
              name="github-actions[bot]"
              email="41898282+github-actions[bot]@users.noreply.github.com"
              ;;
            token)
              echo "::error::PAT authentication does not support verified GitHub bot commits"
              exit 1
              ;;
            *) exit 1 ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "email=$email" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: ${{ steps.sync.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.auth-token.outputs.token }}
          commit-message: 'ci(actions): Update workflow templates from organization template repository'
          committer: ${{ steps.sync-signer.outputs.name }} <${{ steps.sync-signer.outputs.email }}>
          author: ${{ steps.sync-signer.outputs.name }} <${{ steps.sync-signer.outputs.email }}>
          path: target
          signoff: true
          sign-commits: true
          branch: 'automated/noid/${{ matrix.branches }}-update-workflows'
          title: '[${{ matrix.branches }}] ci(actions): Update workflow templates from organization template repository'
          draft: ${{ steps.sync.outputs.patch_failed == 'true' }}
          add-paths: .github/workflows/*.yml,.github/actions-lock.txt
          body: |
            Automated update of workflow templates from [LibreCodeCoop/.github](https://github.com/LibreCodeCoop/.github)
            ${{ steps.sync.outputs.summary }}
          labels: |
            dependencies
            3. to review
