# This workflow will update all workflow templates.
# Additionally it will reapply workflow.yml.patch files after syncing and only then commit the result.
#
# Authentication is selected explicitly with vars.WORKFLOW_SYNC_AUTH_MODE.
# See docs/cross-repository-automation.md for modes, credentials and GITHUB_TOKEN limitations.
name: Update workflows
on:
  workflow_dispatch:
  schedule:
      - cron: "5 2 * * 0"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branches:
          - ${{ github.event.repository.default_branch }}

    name: Update workflows in ${{ matrix.branches }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: admin

      - name: Validate workflow sync authentication
        shell: bash
        env:
          AUTH_MODE: ${{ vars.WORKFLOW_SYNC_AUTH_MODE || 'librecode-app' }}
          LIBRECODE_APP_ID: ${{ vars.LIBRECODE_WORKFLOW_APP_ID }}
          LIBRECODE_APP_PRIVATE_KEY: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
          CONSUMER_APP_ID: ${{ vars.WORKFLOW_SYNC_APP_ID }}
          CONSUMER_APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_SYNC_APP_PRIVATE_KEY }}
          CONSUMER_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          case "${AUTH_MODE}" in
            librecode-app)
              [[ -n "${LIBRECODE_APP_ID}" && -n "${LIBRECODE_APP_PRIVATE_KEY}" ]] || {
                echo "::error::librecode-app requires LIBRECODE_WORKFLOW_APP_ID and LIBRECODE_WORKFLOW_APP_PRIVATE_KEY"
                exit 1
              }
              ;;
            github-app)
              [[ -n "${CONSUMER_APP_ID}" && -n "${CONSUMER_APP_PRIVATE_KEY}" ]] || {
                echo "::error::github-app requires WORKFLOW_SYNC_APP_ID and WORKFLOW_SYNC_APP_PRIVATE_KEY"
                exit 1
              }
              ;;
            token)
              [[ -n "${CONSUMER_TOKEN}" ]] || {
                echo "::error::token mode requires WORKFLOW_SYNC_TOKEN"
                exit 1
              }
              ;;
            github-token)
              ;;
            *)
              echo "::error::Unsupported WORKFLOW_SYNC_AUTH_MODE: ${AUTH_MODE}"
              exit 1
              ;;
          esac

      - name: Create LibreCode GitHub App token
        if: ${{ vars.WORKFLOW_SYNC_AUTH_MODE == '' || vars.WORKFLOW_SYNC_AUTH_MODE == 'librecode-app' }}
        id: librecode-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.LIBRECODE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create consumer GitHub App token
        if: ${{ vars.WORKFLOW_SYNC_AUTH_MODE == 'github-app' }}
        id: consumer-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.WORKFLOW_SYNC_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Resolve workflow sync token
        id: auth-token
        shell: bash
        env:
          AUTH_MODE: ${{ vars.WORKFLOW_SYNC_AUTH_MODE || 'librecode-app' }}
          LIBRECODE_APP_TOKEN: ${{ steps.librecode-app-token.outputs.token }}
          CONSUMER_APP_TOKEN: ${{ steps.consumer-app-token.outputs.token }}
          CONSUMER_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "${AUTH_MODE}" in
            librecode-app) token="${LIBRECODE_APP_TOKEN}" ;;
            github-app) token="${CONSUMER_APP_TOKEN}" ;;
            token) token="${CONSUMER_TOKEN}" ;;
            github-token) token="${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac

          [[ -n "${token}" ]] || {
            echo "::error::Selected workflow sync authentication produced an empty token"
            exit 1
          }

          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          repository: LibreCodeCoop/.github

      - name: Record workflow catalog revision
        id: catalog-revision
        working-directory: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: target
          ref: ${{ matrix.branches }}

      - name: Synchronize workflow templates
        id: sync
        uses: LibreCodeCoop/github-workflows/actions/sync-workflows@002f17274ba1eade3351ba81890bf53674b37c43 # v0.4.0
        with:
          source: source/workflow-templates
          target: target
          platform-version: v0.4.0
          source-commit: 002f17274ba1eade3351ba81890bf53674b37c43
          catalog-commit: ${{ steps.catalog-revision.outputs.sha }}

      - name: Create Pull Request
        if: ${{ steps.sync.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.auth-token.outputs.token }}
          commit-message: 'ci(actions): Update workflow templates from organization template repository'
          committer: GitHub <noreply@github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          path: target
          signoff: true
          branch: 'automated/noid/${{ matrix.branches }}-update-workflows'
          title: '[${{ matrix.branches }}] ci(actions): Update workflow templates from organization template repository'
          draft: ${{ steps.sync.outputs.patch_failed == 'true' }}
          add-paths: .github/workflows/*.yml,.github/actions-lock.txt
          body: |
            Automated update of workflow templates from [LibreCodeCoop/.github](https://github.com/LibreCodeCoop/.github)
            ${{ steps.sync.outputs.summary }}
          labels: |
            dependencies
            3. to review
