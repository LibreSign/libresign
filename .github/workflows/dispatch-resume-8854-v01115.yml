name: Dispatch resume 8854 with release-tool 0.11.16

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-resume-8854-v01115.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch resume workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/resume-release.yml/dispatches" \
            --data '{"ref":"main","inputs":{"pull_request_number":"8854"}}'
