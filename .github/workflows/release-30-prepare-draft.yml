name: Release 30 - Prepare draft

on:
  workflow_dispatch:
    inputs:
      stable_branch:
        description: Stable branch to release (for example stable35)
        required: true
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: release-30-${{ inputs.stable_branch }}
  cancel-in-progress: false

jobs:
  prepare_draft:
    runs-on: ubuntu-latest

    steps:
      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.stable_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: true
          path: libresign

      - name: Resolve release state
        working-directory: libresign
        run: php scripts/release/release.php draft-state > release-state.json

      - name: Export release state
        id: release
        working-directory: libresign
        run: php scripts/release/release.php outputs --json release-state.json --map version:version,tag:tag,previousTag:previous_tag,targetSha:target_sha

      - name: Validate release files
        working-directory: libresign
        run: php scripts/release/release.php validate-files --version "${{ steps.release.outputs.version }}"

      - name: Verify release milestone is finalized
        working-directory: libresign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php scripts/release/release.php assert-milestone-closed --repository "${{ github.repository }}" --title "v${{ steps.release.outputs.version }}"

      - name: Read package engines
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          path: libresign
          fallbackNode: '^24'
          fallbackNpm: '^11.3'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          package-manager-cache: false

      - name: Set up npm
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Get supported PHP version
        id: php-versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3
        with:
          filename: libresign/appinfo/info.xml

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ steps.php-versions.outputs.php-min }}
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install production dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--no-dev'
          working-directory: libresign
          ignore-cache: 'yes'

      - name: Build frontend
        working-directory: libresign
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci && npm run build

      - name: Resolve Nextcloud download
        id: nextcloud
        run: |
          ncversion=$(php -r '$xml = simplexml_load_file("libresign/appinfo/info.xml"); echo (string) $xml->dependencies->nextcloud["min-version"];')
          url=$(curl -fsSL "https://updates.nextcloud.com/updater_server/latest?channel=beta&version=$ncversion" | jq -r '.downloads.zip[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download Nextcloud server
        if: ${{ steps.nextcloud.outputs.url != 'null' }}
        run: wget "${{ steps.nextcloud.outputs.url }}" -O nextcloud.zip && unzip -q nextcloud.zip

      - name: Checkout Nextcloud server fallback
        if: ${{ steps.nextcloud.outputs.url == 'null' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          path: nextcloud

      - name: Build and verify App Store package
        working-directory: libresign
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          mkdir -p build/tools/certificates
          printf '%s\n' "$APP_PRIVATE_KEY" > build/tools/certificates/libresign.key
          make appstore verify-appstore-package

      - name: Generate release notes
        working-directory: libresign
        run: php scripts/release/release.php release-notes --version "${{ steps.release.outputs.version }}" --previous "${{ steps.release.outputs.previous_tag }}" --target "${{ steps.release.outputs.target_sha }}" --repository "${{ github.repository }}" > ../release-notes.md

      - name: Create or update GitHub release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php libresign/scripts/release/release.php draft --repository "${{ github.repository }}" --tag "${{ steps.release.outputs.tag }}" --target "${{ steps.release.outputs.target_sha }}" --notes-file release-notes.md
