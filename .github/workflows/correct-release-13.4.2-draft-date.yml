name: Correct release 13.4.2 draft date

on:
  push:
    branches:
      - stable33
    paths:
      - '.github/workflows/correct-release-13.4.2-draft-date.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Correct draft release date
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == true and .tag_name == "v13.4.2") | .id' \
              | head -n 1
          )"

          if [[ -z "${release_id}" ]]; then
            echo "::error::Draft release v13.4.2 was not found."
            exit 1
          fi

          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body')"
          old_heading='## 13.4.2 - 2026-09-21'
          new_heading='## 13.4.2 - 2026-09-22'

          if [[ "${body}" != *"${old_heading}"* ]]; then
            if [[ "${body}" == *"${new_heading}"* ]]; then
              echo "Draft release date is already correct."
              exit 0
            fi

            echo "::error::Expected v13.4.2 release heading was not found."
            exit 1
          fi

          updated_body="${body/${old_heading}/${new_heading}}"
          jq -n --arg body "${updated_body}" '{body: $body}' \
            | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --input -
