name: Devcontainer

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  contract:
    name: Devcontainer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats

      - name: Check Dev Container configuration
        run: |
          jq empty .devcontainer/devcontainer.json
          shellcheck .devcontainer/prepare.sh .devcontainer/setup.sh
          sh -n .devcontainer/prepare.sh
          bash -n .devcontainer/setup.sh

          ! jq -e '
            ((.forwardPorts // [])[]? | strings | contains(":")) or
            ((.portsAttributes // {} | keys[]) | contains(":"))
          ' .devcontainer/devcontainer.json

      - name: Test devcontainer bootstrap contract
        run: bats --print-output-on-failure .devcontainer/tests/prepare.bats

  integration:
    name: Devcontainer integration
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Dev Container CLI
        run: npm install --global "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Start the Dev Container
        run: devcontainer up --workspace-folder .

      - name: Verify Nextcloud, LibreSign and Mailpit
        run: |
          devcontainer exec --workspace-folder . \
            bash -lc "occ status | grep -q 'installed: true'"
          devcontainer exec --workspace-folder . \
            bash -lc "occ app:list --enabled | grep -q libresign"
          devcontainer exec --workspace-folder . \
            bash -lc "curl --fail --silent http://mailpit:8025/api/v1/info >/dev/null"

      - name: Verify Playwright reaches Nextcloud through the proxy
        run: |
          docker compose \
            --file .devcontainer/ncdd.generated.yml \
            --file .devcontainer/docker-compose.yml \
            --profile playwright \
            exec -T playwright node <<'NODE'
          const dns = require('dns').promises
          const { chromium } = require('/var/www/html/apps-extra/libresign/node_modules/playwright')

          ;(async () => {
            const target = new URL(process.env.PLAYWRIGHT_BASE_URL + '/status.php')
            const addresses = await dns.lookup(target.hostname, { all: true })
            console.log('Resolved', target.hostname, addresses)

            const browser = await chromium.launch()
            try {
              const context = await browser.newContext({ ignoreHTTPSErrors: true })
              const page = await context.newPage()
              const response = await page.goto(target.href, { waitUntil: 'domcontentloaded' })

              if (!response) {
                throw new Error('Playwright did not receive an HTTP response')
              }

              console.log('Playwright response', response.status(), response.url())
              if (response.status() !== 200) {
                throw new Error(`Expected HTTP 200, got ${response.status()}`)
              }
            } finally {
              await browser.close()
            }
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Collect container diagnostics
        if: failure()
        run: |
          docker compose \
            --file .devcontainer/ncdd.generated.yml \
            --file .devcontainer/docker-compose.yml \
            --profile playwright \
            ps
          docker compose \
            --file .devcontainer/ncdd.generated.yml \
            --file .devcontainer/docker-compose.yml \
            --profile playwright \
            logs --no-color --tail=200
