name: Devcontainer

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'

permissions:
  contents: read

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate shell scripts
        run: |
          sh -n .devcontainer/prepare.sh
          bash -n .devcontainer/setup.sh
          bash -n .devcontainer/ci-smoke.sh
      - name: Exercise the Dev Container lifecycle
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            occ status | grep -q 'installed: true'
            occ app:list --enabled | grep -q libresign
            curl --fail --silent http://mailpit:8025/api/v1/info >/dev/null

  services:
    name: NCDD service smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash .devcontainer/ci-smoke.sh
