name: Devcontainer

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  contract:
    name: Devcontainer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check shell scripts
        run: |
          shellcheck .devcontainer/prepare.sh .devcontainer/setup.sh
          sh -n .devcontainer/prepare.sh
          bash -n .devcontainer/setup.sh

      - name: Verify local NCDD contract
        run: |
          sh .devcontainer/prepare.sh
          cp .devcontainer/ncdd.generated.yml /tmp/ncdd.generated.first.yml

          docker compose \
            --file .devcontainer/ncdd.generated.yml \
            --file .devcontainer/docker-compose.yml \
            --profile playwright \
            config --quiet

          grep -q "HOST_UID: $(id -u)" .devcontainer/ncdd.generated.yml
          grep -q "HOST_GID: $(id -g)" .devcontainer/ncdd.generated.yml
          grep -Eq 'NEXTCLOUD_HOST: ncdev-.*\.localhost' .devcontainer/ncdd.generated.yml

          sh .devcontainer/prepare.sh
          cmp /tmp/ncdd.generated.first.yml .devcontainer/ncdd.generated.yml

      - name: Verify configuration overrides
        env:
          LIBRESIGN_DB_TYPE: sqlite
          LIBRESIGN_NEXTCLOUD_VERSION: stable35
        run: |
          sh .devcontainer/prepare.sh
          grep -q 'DB_TYPE: sqlite' .devcontainer/ncdd.generated.yml
          grep -q 'DB_DRIVER: sqlite' .devcontainer/ncdd.generated.yml
          grep -q 'VERSION_NEXTCLOUD: stable35' .devcontainer/ncdd.generated.yml

      - name: Verify incomplete Codespaces context is rejected
        run: |
          if CODESPACES=true sh .devcontainer/prepare.sh >/tmp/prepare.out 2>/tmp/prepare.err; then
            echo "prepare.sh accepted Codespaces without the required environment" >&2
            exit 1
          fi
          grep -q 'CODESPACE_NAME is required in Codespaces' /tmp/prepare.err

      - name: Verify Codespaces NCDD contract
        env:
          CODESPACES: "true"
          CODESPACE_NAME: libresign-test
          GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
        run: |
          sh .devcontainer/prepare.sh
          grep -q 'NEXTCLOUD_HOST: libresign-test-443.app.github.dev' .devcontainer/ncdd.generated.yml
          grep -q 'NEXTCLOUD_PROTOCOL: https' .devcontainer/ncdd.generated.yml

  integration:
    name: Devcontainer integration
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Dev Container CLI
        run: npm install --global "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Start the Dev Container
        run: devcontainer up --workspace-folder .

      - name: Verify Nextcloud, LibreSign and Mailpit
        run: |
          devcontainer exec --workspace-folder . \
            bash -lc "occ status | grep -q 'installed: true'"
          devcontainer exec --workspace-folder . \
            bash -lc "occ app:list --enabled | grep -q libresign"
          devcontainer exec --workspace-folder . \
            bash -lc "curl --fail --silent http://mailpit:8025/api/v1/info >/dev/null"

      - name: Verify Playwright reaches Nextcloud through the proxy
        run: |
          docker compose \
            --file .devcontainer/ncdd.generated.yml \
            --file .devcontainer/docker-compose.yml \
            --profile playwright \
            exec -T playwright node -e '
              const https = require("https");
              const target = new URL(process.env.PLAYWRIGHT_BASE_URL + "/status.php");
              const request = https.get(target, { rejectUnauthorized: false }, response => {
                if (response.statusCode !== 200) process.exitCode = 1;
                response.resume();
              });
              request.on("error", () => { process.exitCode = 1; });
            '
