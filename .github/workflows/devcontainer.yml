name: Devcontainer contract

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate adapter scripts
        run: |
          sh -n .devcontainer/prepare.sh
          bash -n .devcontainer/setup.sh
      - name: Prepare pinned NCDD
        run: sh .devcontainer/prepare.sh
      - name: Validate local composed environment
        run: docker compose --file .devcontainer/ncdd.generated.yml --file .devcontainer/docker-compose.yml config --quiet
      - name: Verify local access uses the shared NCDD proxy
        run: |
          ! grep -q 'published: "8080"' .devcontainer/ncdd.generated.yml
          grep -Eq 'NEXTCLOUD_HOST: ncdev-.*\.localhost' .devcontainer/ncdd.generated.yml
      - name: Validate Codespaces public URL contract
        env:
          CODESPACES: "true"
          CODESPACE_NAME: libresign-test
          GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
        run: |
          sh .devcontainer/prepare.sh
          docker compose --file .devcontainer/ncdd.generated.yml --file .devcontainer/docker-compose.yml config --quiet
          grep -q 'NEXTCLOUD_HOST: libresign-test-443.app.github.dev' .devcontainer/ncdd.generated.yml
          grep -q 'NEXTCLOUD_PROTOCOL: https' .devcontainer/ncdd.generated.yml
          ! grep -q 'published:' .devcontainer/ncdd.generated.yml
      - name: Verify LibreSign does not duplicate NCDD services
        run: |
          ! grep -Eq '^[[:space:]]+(database|mysql|mariadb|mailpit|redis):$' .devcontainer/docker-compose.yml
          ! grep -Eq '^[[:space:]]+image:' .devcontainer/docker-compose.yml
