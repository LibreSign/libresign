name: Resume release finalization
run-name: Resume release finalization · PR #${{ inputs.pull_request_number }}

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Merged release preparation pull request number to resume.
        required: true
        type: number

permissions: {}

concurrency:
  group: release-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resume:
    name: Resume release finalization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - id: context
        name: Resolve release resume context
        uses: LibreCodeCoop/release-tool/actions/resume-context@9b33a67a7b1e37a45b0a3c252370899effcdfdc2
        with:
          pull-request-number: ${{ inputs.pull_request_number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout merged release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ steps.context.outputs.base-ref }}

      - name: Fetch merged release history
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.context.outputs.base-ref }}
        run: |
          set -euo pipefail
          git fetch --quiet --unshallow --prune origin             "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"             "+refs/tags/*:refs/tags/*"

      - name: Resume merged release finalization
        uses: LibreCodeCoop/release-tool/actions/post-merge@40e17457fe28003e5893bf55e3c2102c965ddb8c
        with:
          pull-request-number: ${{ inputs.pull_request_number }}
          merger: ${{ steps.context.outputs.merger }}
          config-path: .nextcloud-release.yml
          prepare-workflow-path: .github/workflows/prepare-release.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
