name: Resume release finalization
run-name: Resume release finalization · PR #${{ inputs.pull_request_number }}

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Merged release preparation pull request number to resume.
        required: true
        type: number

permissions: {}

concurrency:
  group: release-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resume:
    name: Resume release finalization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - id: release-pr
        name: Validate merged release preparation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR_NUMBER}")"
          merged="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo !empty($d["merged"]) ? "true" : "false";' <<< "${pr_json}")"
          base_ref="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["base"]["ref"] ?? "";' <<< "${pr_json}")"
          head_ref="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["head"]["ref"] ?? "";' <<< "${pr_json}")"
          merger="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["merged_by"]["login"] ?? "";' <<< "${pr_json}")"
          body="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["body"] ?? "";' <<< "${pr_json}")"

          if [[ "${merged}" != "true" ]]; then
            echo "::error::PR #${RELEASE_PR_NUMBER} is not merged."
            exit 2
          fi
          if [[ "${head_ref}" != release-tool/* ]]; then
            echo "::error::PR #${RELEASE_PR_NUMBER} is not a release-tool preparation PR."
            exit 2
          fi
          if [[ "${body}" != *"<!-- release-tool:preparation "* ]]; then
            echo "::error::PR #${RELEASE_PR_NUMBER} does not contain a release-tool preparation marker."
            exit 2
          fi
          if [[ -z "${base_ref}" || -z "${merger}" ]]; then
            echo "::error::PR #${RELEASE_PR_NUMBER} is missing base branch or merger metadata."
            exit 2
          fi

          echo "base-ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "merger=${merger}" >> "${GITHUB_OUTPUT}"

      - name: Checkout merged release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ steps.release-pr.outputs.base-ref }}

      - name: Fetch merged release history
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.base-ref }}
        run: |
          set -euo pipefail
          git fetch --quiet --unshallow --prune origin             "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"             "+refs/tags/*:refs/tags/*"

      - name: Resume merged release finalization
        uses: LibreCodeCoop/release-tool/actions/post-merge@2cadc91c5e04e2f9bb8eb0c20e8c3cf608f37b11
        with:
          pull-request-number: ${{ inputs.pull_request_number }}
          merger: ${{ steps.release-pr.outputs.merger }}
          config-path: .nextcloud-release.yml
          prepare-workflow-path: .github/workflows/prepare-release.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
