name: Recover release finalization

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Merged generated release PR number to finalize, e.g. 8656'
        required: true
        type: string

permissions: {}

jobs:
  recover:
    name: Finalize merged release and prepare draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - id: pr
        name: Validate merged generated release PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ inputs.pull_request }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${RELEASE_REPOSITORY}/pulls/${RELEASE_PR}")"
          merged="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo !empty($d["merged"]) ? "true" : "false";' <<< "${pr_json}")"
          head_ref="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["head"]["ref"] ?? "";' <<< "${pr_json}")"
          base_ref="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["base"]["ref"] ?? "";' <<< "${pr_json}")"
          merger="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["merged_by"]["login"] ?? "";' <<< "${pr_json}")"
          body="$(php -r '$d=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); echo $d["body"] ?? "";' <<< "${pr_json}")"

          if [[ "${merged}" != "true" ]]; then
            echo "::error::PR #${RELEASE_PR} is not merged."
            exit 1
          fi
          if [[ "${head_ref}" != release-tool/* ]]; then
            echo "::error::PR #${RELEASE_PR} is not a generated release-tool PR."
            exit 1
          fi
          if [[ "${body}" != *"<!-- release-tool:preparation "* ]]; then
            echo "::error::PR #${RELEASE_PR} does not contain a release preparation marker."
            exit 1
          fi
          if [[ -z "${base_ref}" || -z "${merger}" ]]; then
            echo "::error::Could not resolve PR base branch or merger."
            exit 1
          fi

          echo "base-ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "merger=${merger}" >> "${GITHUB_OUTPUT}"

      - name: Checkout merged release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.base-ref }}

      - name: Fetch merged release history
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.pr.outputs.base-ref }}
        run: |
          set -euo pipefail
          git fetch --quiet --unshallow --prune origin             "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"             "+refs/tags/*:refs/tags/*"

      - name: Finalize merged release
        uses: LibreCodeCoop/github-workflows/actions/release-post-merge@90cd667c241ebcd6982681ff82152c3a903e9341 # v0.6.27
        with:
          pull-request-number: ${{ inputs.pull_request }}
          merger: ${{ steps.pr.outputs.merger }}
          config-path: .nextcloud-release.yml
          prepare-workflow-path: .github/workflows/prepare-release.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
