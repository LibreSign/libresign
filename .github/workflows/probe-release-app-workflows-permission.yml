name: Probe release App workflows permission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/probe-release-app-workflows-permission.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve App client id
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app_json="$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/apps/librecode-workflow-automation")"
          client_id="$(jq -r '.client_id' <<< "${app_json}")"
          test -n "${client_id}"
          echo "client-id=${client_id}" >> "${GITHUB_OUTPUT}"

      - name: Mint release draft capability token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.app.outputs.client-id }}
          private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: LibreSign
          repositories: libresign
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: read
