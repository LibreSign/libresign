name: Repair release 13.4.2 draft

on:
  push:
    branches:
      - stable33
    paths:
      - '.github/workflows/repair-release-13.4.2-draft.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repair draft identity and body
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '393844549'
          TARGET_SHA: '12cb3fc4c87d4657dc1bffec0f61853f7dc1dbb2'
        shell: bash
        run: |
          set -euo pipefail

          body="$(cat <<'EOF'
## 13.4.2 - 2026-09-22

### Security
- Security fixes and other improvements

Milestone: [v13.4.2](https://github.com/LibreSign/libresign/milestone/152?closed=1)

**Full Changelog**: https://github.com/LibreSign/libresign/compare/v13.4.1...v13.4.2
EOF
)"

          jq -n \
            --arg tag_name 'v13.4.2' \
            --arg target_commitish "${TARGET_SHA}" \
            --arg name '13.4.2' \
            --arg body "${body}" \
            '{
              tag_name: $tag_name,
              target_commitish: $target_commitish,
              name: $name,
              body: $body,
              draft: true,
              prerelease: false
            }' \
            | gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                --input -

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '{tag_name,target_commitish,name,draft,prerelease,body}'
