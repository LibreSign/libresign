name: Release 20 - Finalize preparation

on:
  pull_request:
    branches:
      - stable*
    types:
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: release-20-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'automation/release-stable')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Check release PR scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php scripts/release/release.php check-pr-scope --repository "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"

      - name: Finalize release milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php scripts/release/release.php finalize-milestone --repository "${{ github.repository }}" --branch "${{ github.event.pull_request.base.ref }}" --final "${{ contains(github.event.pull_request.body, 'release-automation:final-stable-release=true') }}"
