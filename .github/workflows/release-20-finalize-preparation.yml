name: Finalize release preparation

on:
  pull_request:
    branches:
      - stable*
    types:
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: finalize-release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'automation/release-stable')
    runs-on: ubuntu-latest

    steps:
      - name: Check release PR scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          unexpected=$(gh api             "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100"             --jq '.[].filename'             | grep -Ev '^(CHANGELOG\.md|appinfo/info\.xml|package\.json|package-lock\.json)$' || true)

          if [ -n "$unexpected" ]; then
            echo "::error::Release PR changed files outside the allowed release scope:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Checkout merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Resolve release metadata
        id: release
        env:
          STABLE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          version=$(php -r '$xml = simplexml_load_file("appinfo/info.xml"); echo (string)$xml->version;')
          stable_number=${STABLE_BRANCH#stable}

          if printf '%s\n' "$PR_BODY" | grep -q 'release-automation:final-stable-release=true'; then
            final_stable_release=true
          else
            final_stable_release=false
          fi

          {
            echo "version=$version"
            echo "stable_number=$stable_number"
            echo "final_stable_release=$final_stable_release"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve current milestone
        id: milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          STABLE_NUMBER: ${{ steps.release.outputs.stable_number }}
        run: |
          set -euo pipefail

          milestones=$(gh api "repos/${{ github.repository }}/milestones?state=all&per_page=100")

          release_number=$(printf '%s' "$milestones" | jq -r --arg title "v$VERSION" '
            .[] | select(.title == $title) | .number
          ' | head -n1)

          if [ -n "$release_number" ]; then
            state=$(printf '%s' "$milestones" | jq -r --argjson number "$release_number" '
              .[] | select(.number == $number) | .state
            ')
            {
              echo "number=$release_number"
              echo "already_named=true"
              echo "state=$state"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next_patch_number=$(printf '%s' "$milestones" | jq -r --arg suffix "Next Patch ($STABLE_NUMBER)" '
            .[] | select(.state == "open" and (.title | endswith($suffix))) | .number
          ' | head -n1)

          if [ -z "$next_patch_number" ]; then
            echo "::error::Open Next Patch ($STABLE_NUMBER) milestone was not found"
            exit 1
          fi

          {
            echo "number=$next_patch_number"
            echo "already_named=false"
            echo "state=open"
          } >> "$GITHUB_OUTPUT"

      - name: Check final stable milestone is empty
        if: ${{ steps.release.outputs.final_stable_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_NUMBER: ${{ steps.milestone.outputs.number }}
        run: |
          set -euo pipefail

          open_items=$(gh api --paginate             "repos/${{ github.repository }}/issues?state=open&milestone=$MILESTONE_NUMBER&per_page=100"             --jq '.[].number')

          if [ -n "$open_items" ]; then
            echo "::error::Final stable release still has open milestone items:"
            printf '%s\n' "$open_items"
            exit 1
          fi

      - name: Rename release milestone
        if: ${{ steps.milestone.outputs.already_named != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_NUMBER: ${{ steps.milestone.outputs.number }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh api             --method PATCH             "repos/${{ github.repository }}/milestones/$MILESTONE_NUMBER"             -f title="v$VERSION" >/dev/null

      - name: Create or resolve next patch milestone
        id: next_milestone
        if: ${{ steps.release.outputs.final_stable_release != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_NUMBER: ${{ steps.release.outputs.stable_number }}
          RELEASE_MILESTONE: ${{ steps.milestone.outputs.number }}
        run: |
          set -euo pipefail

          title="💚 Next Patch ($STABLE_NUMBER)"
          milestones=$(gh api "repos/${{ github.repository }}/milestones?state=open&per_page=100")
          number=$(printf '%s' "$milestones" | jq -r             --arg title "$title"             --argjson release "$RELEASE_MILESTONE" '
              .[] | select(.title == $title and .number != $release) | .number
            ' | head -n1)

          if [ -z "$number" ]; then
            due_on=$(date -u -d '+28 days' '+%Y-%m-%dT%H:%M:%SZ')
            number=$(gh api               --method POST               "repos/${{ github.repository }}/milestones"               -f title="$title"               -f due_on="$due_on"               --jq '.number')
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Move remaining open items
        if: ${{ steps.release.outputs.final_stable_release != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MILESTONE: ${{ steps.milestone.outputs.number }}
          NEXT_MILESTONE: ${{ steps.next_milestone.outputs.number }}
        run: |
          set -euo pipefail

          gh api --paginate             "repos/${{ github.repository }}/issues?state=open&milestone=$RELEASE_MILESTONE&per_page=100"             --jq '.[].number' |
          while read -r number; do
            [ -n "$number" ] || continue
            gh api               --method PATCH               "repos/${{ github.repository }}/issues/$number"               -F milestone="$NEXT_MILESTONE" >/dev/null
          done

      - name: Close release milestone
        if: ${{ steps.milestone.outputs.state != 'closed' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_NUMBER: ${{ steps.milestone.outputs.number }}
        run: |
          gh api             --method PATCH             "repos/${{ github.repository }}/milestones/$MILESTONE_NUMBER"             -f state=closed >/dev/null
