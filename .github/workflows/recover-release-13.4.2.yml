name: Recover release 13.4.2

on:
  push:
    branches:
      - stable33
    paths:
      - '.github/workflows/recover-release-13.4.2.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stable33
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: stable33

      - name: Fetch release history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --unshallow --prune origin \
            "+refs/heads/stable33:refs/remotes/origin/stable33" \
            "+refs/tags/*:refs/tags/*"

      - name: Recover merged release 13.4.2
        uses: LibreCodeCoop/github-workflows/actions/release-post-merge@60ac698813811ee9d2bcf57b77c5bcf6455a3028 # v0.6.11
        with:
          pull-request-number: 8555
          merger: vitormattos
          config-path: .nextcloud-release.yml
          prepare-workflow-path: .github/workflows/prepare-release.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-id: ${{ vars.LIBRECODE_WORKFLOW_APP_ID }}
          app-private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
