name: Recover release 15.0.5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-release-15.0.5.yml

permissions: {}

concurrency:
  group: release-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: contains(github.event.head_commit.message, 'ci: recover release 15.0.5')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - id: context
        uses: LibreCodeCoop/release-tool/actions/resume-context@e2c446dc3da2f0ae8db380b9de02a29278e23372
        with:
          pull-request-number: 8854
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ steps.context.outputs.base-ref }}

      - name: Fetch merged release history
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.context.outputs.base-ref }}
        run: |
          set -euo pipefail
          git fetch --quiet --unshallow --prune origin \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
            "+refs/tags/*:refs/tags/*"

      - name: Resume merged release finalization
        uses: LibreCodeCoop/release-tool/actions/post-merge@e2c446dc3da2f0ae8db380b9de02a29278e23372
        with:
          pull-request-number: 8854
          merger: ${{ steps.context.outputs.merger }}
          config-path: .nextcloud-release.yml
          prepare-workflow-path: .github/workflows/prepare-release.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
