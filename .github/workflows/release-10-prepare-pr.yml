name: Release 10 - Prepare release PR

on:
  workflow_dispatch:
    inputs:
      stable_branch:
        description: Stable branch to prepare (for example stable35)
        required: true
        type: string
      dry_run:
        description: Analyze only, without creating or updating a pull request
        required: true
        default: true
        type: boolean
      final_stable_release:
        description: This is the final release of this stable branch
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: release-10-${{ inputs.stable_branch }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze release
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.state.outputs.current_version }}
      next_version: ${{ steps.plan.outputs.next_version }}
      bump: ${{ steps.plan.outputs.bump }}
      previous_tag: ${{ steps.state.outputs.previous_tag }}
      head_sha: ${{ steps.state.outputs.head_sha }}
      milestone_number: ${{ steps.milestone.outputs.number }}
      milestone_title: ${{ steps.milestone.outputs.title }}

    steps:
      - name: Checkout stable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.stable_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Inspect release state
        run: php scripts/release/release.php inspect > release-state.json

      - name: Export release state
        id: state
        run: php scripts/release/release.php outputs --json release-state.json --map previousTag:previous_tag,currentVersion:current_version,headSha:head_sha

      - name: Check pending backports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php scripts/release/release.php pending-backports --repository "${{ github.repository }}"

      - name: Resolve release milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php scripts/release/release.php milestone --repository "${{ github.repository }}" --branch "${{ inputs.stable_branch }}" > milestone.json

      - name: Export milestone
        id: milestone
        run: php scripts/release/release.php outputs --json milestone.json --map number:number,title:title

      - name: Collect release pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php scripts/release/release.php collect-prs --repository "${{ github.repository }}" --branch "${{ inputs.stable_branch }}" --previous-tag "${{ steps.state.outputs.previous_tag }}" > prs.json

      - name: Plan release
        run: php scripts/release/release.php plan --current-version "${{ steps.state.outputs.current_version }}" --prs prs.json > release-plan.json

      - name: Export release plan
        id: plan
        run: php scripts/release/release.php outputs --json release-plan.json --map nextVersion:next_version,bump:bump

      - name: Write release summary
        run: php scripts/release/release.php summary --state release-state.json --plan release-plan.json --milestone milestone.json --branch "${{ inputs.stable_branch }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan-${{ inputs.stable_branch }}
          path: |
            release-state.json
            release-plan.json
            milestone.json
            prs.json

  create_pull_request:
    name: Create or update release PR
    needs: analyze
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.stable_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan-${{ inputs.stable_branch }}

      - name: Apply release plan
        run: php scripts/release/release.php apply --plan release-plan.json

      - name: Validate generated release files
        run: php scripts/release/release.php validate-files --version "${{ needs.analyze.outputs.next_version }}"

      - name: Check generated diff
        run: git diff --check

      - name: Create or update release PR
        id: release_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4b20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }}
          branch: automation/release-${{ inputs.stable_branch }}
          base: ${{ inputs.stable_branch }}
          title: 'chore(release): prepare ${{ needs.analyze.outputs.next_version }}'
          commit-message: 'chore(release): prepare ${{ needs.analyze.outputs.next_version }} [skip ci]'
          committer: GitHub <noreply@github.com>
          author: nextcloud-command <nextcloud-command@users.noreply.github.com>
          signoff: true
          delete-branch: true
          milestone: ${{ needs.analyze.outputs.milestone_number }}
          add-paths: |
            CHANGELOG.md
            appinfo/info.xml
            package.json
            package-lock.json
          body: |
            ## Summary

            Automated release preparation for ${{ needs.analyze.outputs.next_version }}.

            - Stable branch: ${{ inputs.stable_branch }}
            - Previous release: ${{ needs.analyze.outputs.previous_tag }}
            - Version bump: ${{ needs.analyze.outputs.bump }}

            This PR is generated by **Release 10 - Prepare release PR** and is limited to the changelog and release version files.

            <!-- release-automation:stable=${{ inputs.stable_branch }} -->
            <!-- release-automation:final-stable-release=${{ inputs.final_stable_release }} -->
