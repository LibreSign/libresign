name: Viewer dialogs compatibility

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test the compatibility check
        run: node --test .github/scripts/check-viewer-dialogs-compatibility.test.mjs

      - name: Detect when the native Viewer isolation can be removed
        run: node .github/scripts/check-viewer-dialogs-compatibility.mjs
