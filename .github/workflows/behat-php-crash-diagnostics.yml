name: Behat PHP crash diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/behat-php-crash-diagnostics.yml'
      - 'tests/integration/scripts/stress-behat-crash.sh'
      - 'tests/integration/scripts/collect-php-server-diagnostics.sh'
      - 'tests/integration/scripts/run-behat-with-watchdog.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behat-php-crash-diagnostics-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  stress:
    name: ${{ matrix.flow }} / imagick=${{ matrix.imagick }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: request-signature
            imagick: 'on'
            php_extensions: none, bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, mysql, pdo_mysql, imagick
          - flow: request-signature
            imagick: 'off'
            php_extensions: none, bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, mysql, pdo_mysql
          - flow: validate-uuid
            imagick: 'on'
            php_extensions: none, bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, mysql, pdo_mysql, imagick
          - flow: validate-uuid
            imagick: 'off'
            php_extensions: none, bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, mysql, pdo_mysql

    services:
      mysql:
        image: ghcr.io/nextcloud/continuous-integration-mariadb-10.6:latest
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025/tcp
          - 1025:1025/tcp

    env:
      APP_NAME: libresign
      PHP_VERSION: '8.3'
      NEXTCLOUD_REF: 5d6fdcb28fb170c2725f23661366d74ac978ef41
      NOTIFICATIONS_REF: addebde43e30da3d56418bb9c597997ed05a4b00
      ACTIVITY_REF: 635b4b4ae103ca4111dea417486aac92214906bd
      GUESTS_REF: c9427b60e751108922a2ee724ea472d9d64e3203
      STRESS_FLOW: ${{ matrix.flow }}
      STRESS_REQUESTS: '500'
      BEHAT_WORKERS: '0'
      BEHAT_NO_PROGRESS_TIMEOUT: '120'
      BEHAT_MAX_RUN_SECONDS: '1200'

    steps:
      - name: Install system and crash diagnostics
        run: |
          sudo apt update
          sudo apt install -y poppler-utils gdb systemd-coredump lsof procps psmisc strace iproute2 binutils elfutils
          sudo sysctl -w kernel.core_pattern='/tmp/core.%e.%p.%t' || true
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

          echo "core_pattern=$(cat /proc/sys/kernel/core_pattern)"
          echo "core_uses_pid=$(cat /proc/sys/kernel/core_uses_pid)"
          echo "ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || true)"

      - name: Checkout pinned Nextcloud server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ env.NEXTCLOUD_REF }}

      - name: Checkout LibreSign under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          path: apps/${{ env.APP_NAME }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: phpunit
          extensions: ${{ matrix.php_extensions }}
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify controlled extension set
        run: |
          php -v
          php -m
          if [ "${{ matrix.imagick }}" = "on" ]; then
            php -r 'exit(extension_loaded("imagick") ? 0 : 1);'
          else
            php -r 'exit(extension_loaded("imagick") ? 1 : 0);'
          fi

      - name: Record PHP binary metadata
        run: |
          mkdir -p php-runtime-metadata
          php -v > php-runtime-metadata/php-version.txt
          php --ini > php-runtime-metadata/php-ini.txt
          php -m > php-runtime-metadata/php-modules.txt
          file "$(command -v php)" > php-runtime-metadata/php-file.txt
          readelf -n "$(command -v php)" > php-runtime-metadata/php-notes.txt 2>&1 || true
          nm -D "$(command -v php)" | grep -E 'zend_objects_store_del|zend_objects_destroy_object' > php-runtime-metadata/php-zend-symbols.txt 2>&1 || true
          objdump -d --disassemble=zend_objects_store_del "$(command -v php)" > php-runtime-metadata/zend_objects_store_del.disasm.txt 2>&1 || true
          ldd "$(command -v php)" > php-runtime-metadata/php-ldd.txt 2>&1 || true

      - name: Prepare LibreSign dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer install --no-dev
          composer --working-dir=tests/integration install

      - name: Install pinned Nextcloud apps
        run: |
          git clone https://github.com/nextcloud/notifications apps/notifications
          git -C apps/notifications checkout "${NOTIFICATIONS_REF}"
          composer --working-dir=apps/notifications install --no-dev

          git clone https://github.com/nextcloud/activity apps/activity
          git -C apps/activity checkout "${ACTIVITY_REF}"
          composer --working-dir=apps/activity install --no-dev

          git clone https://github.com/nextcloud/guests apps/guests
          git -C apps/guests checkout "${GUESTS_REF}"
          composer --working-dir=apps/guests install --no-dev

      - name: Set up Nextcloud
        env:
          DB_PORT: 4444
        run: |
          echo "127.0.0.1 mailpit" | sudo tee -a /etc/hosts
          mkdir data
          ./occ maintenance:install \
            --verbose \
            --database=mysql \
            --database-name=nextcloud \
            --database-host=127.0.0.1 \
            --database-port=${DB_PORT} \
            --database-user=root \
            --database-pass=rootpassword \
            --admin-user=admin \
            --admin-pass=admin

          ./occ --version
          ./occ app:enable --force "${APP_NAME}"
          ./occ app:enable --force notifications
          ./occ app:enable --force activity
          ./occ app:enable --force guests
          ./occ config:system:set allow_local_remote_servers --value true --type boolean
          ./occ config:system:set auth.bruteforce.protection.enabled --value false --type boolean
          ./occ config:system:set mail_smtphost --value mailpit
          ./occ config:system:set mail_smtpport --value 1025 --type integer
          ./occ config:system:set ratelimit.protection.enabled --value false --type boolean
          ./occ config:app:set dav enableDefaultContact --value false --type boolean

      - name: Stress ${{ matrix.flow }} with Imagick ${{ matrix.imagick }}
        working-directory: apps/${{ env.APP_NAME }}/tests/integration
        env:
          BEHAT_ROOT_DIR: ../../../../
          BEHAT_RUN_AS: runner
          BEHAT_VERBOSE: '1'
        run: |
          ulimit -c unlimited
          echo "flow=${STRESS_FLOW}"
          echo "requests=${STRESS_REQUESTS}"
          echo "imagick=${{ matrix.imagick }}"
          echo "workers=${BEHAT_WORKERS}"
          bash scripts/stress-behat-crash.sh

      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behat-crash-${{ matrix.flow }}-imagick-${{ matrix.imagick }}-${{ github.run_id }}
          path: |
            behat-crash-diagnostics/
            php-runtime-metadata/
            /tmp/behat-php-server-*
            /tmp/core.*
          if-no-files-found: warn
