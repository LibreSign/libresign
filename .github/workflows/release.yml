name: Prepare stable release

on:
  workflow_dispatch:
    inputs:
      stable_branch:
        description: Stable branch to release (for example stable35)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.stable_branch }}
  cancel-in-progress: false

jobs:
  prepare_release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate requested branch
        env:
          STABLE_BRANCH: ${{ inputs.stable_branch }}
        run: |
          if ! [[ "$STABLE_BRANCH" =~ ^stable[0-9]+$ ]]; then
            echo "::error::stable_branch must match stableNN"
            exit 1
          fi

      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.stable_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: true
          path: libresign

      - name: Resolve and validate release version
        id: release
        env:
          STABLE_BRANCH: ${{ inputs.stable_branch }}
        run: |
          set -eu
          cd libresign

          version=$(php -r '$xml = simplexml_load_file("appinfo/info.xml"); echo (string) $xml->version;')
          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")

          case "$version" in
            *-dev*|*-alpha*|*-beta*|*-rc*)
              echo "::error::appinfo/info.xml contains a development or prerelease version: $version"
              exit 1
              ;;
          esac

          if [ "$package_version" != "$version" ] || [ "$lock_version" != "$version" ]; then
            echo "::error::Version mismatch: info.xml=$version package.json=$package_version package-lock.json=$lock_version"
            exit 1
          fi

          tag="v$version"
          target_sha=$(git rev-parse HEAD)

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          previous_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD 2>/dev/null || true)
          if [ -z "$previous_tag" ]; then
            echo "::error::Could not resolve previous stable release tag"
            exit 1
          fi

          previous_version=${previous_tag#v}
          current_major=${version%%.*}
          previous_major=${previous_version%%.*}
          if [ "$current_major" != "$previous_major" ]; then
            echo "::error::Previous tag $previous_tag does not match release major $current_major"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Verify changelog contains release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd libresign
          grep -Eq "^## ${VERSION} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no release section for $VERSION"
            exit 1
          }

      - name: Read package engines
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          path: libresign
          fallbackNode: '^24'
          fallbackNpm: '^11.3'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          package-manager-cache: false

      - name: Set up npm
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Get supported PHP version
        id: php-versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3
        with:
          filename: libresign/appinfo/info.xml

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ steps.php-versions.outputs.php-min }}
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install production dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--no-dev'
          working-directory: libresign
          ignore-cache: 'yes'

      - name: Build frontend
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          cd libresign
          npm ci
          npm run build

      - name: Resolve Nextcloud download
        id: nextcloud
        run: |
          set -eu
          ncversion=$(php -r '$xml = simplexml_load_file("libresign/appinfo/info.xml"); echo (string) $xml->dependencies->nextcloud["min-version"];')
          url=$(curl -fsSL "https://updates.nextcloud.com/updater_server/latest?channel=beta&version=$ncversion" | jq -r '.downloads.zip[0]')
          echo "version=$ncversion" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download Nextcloud server
        if: ${{ steps.nextcloud.outputs.url != 'null' }}
        run: |
          wget "${{ steps.nextcloud.outputs.url }}" -O nextcloud.zip
          unzip -q nextcloud.zip

      - name: Checkout Nextcloud server fallback
        if: ${{ steps.nextcloud.outputs.url == 'null' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          path: nextcloud

      - name: Build and verify App Store package
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -eu
          cd libresign
          mkdir -p build/tools/certificates
          printf '%s\n' "$APP_PRIVATE_KEY" > build/tools/certificates/libresign.key
          make appstore verify-appstore-package

      - name: Create or update GitHub release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -eu

          cd libresign
          awk -v version="${{ steps.release.outputs.version }}" '
            $0 ~ "^## " version " - " { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > ../release-notes.md

          {
            echo "## What's Changed"
            cat ../release-notes.md
            echo
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${{ steps.release.outputs.previous_tag }}...${{ steps.release.outputs.tag }}"
          } > ../release-notes.final.md

          cd ..

          release_json=$(gh api "repos/${{ github.repository }}/releases?per_page=100")
          release_id=$(printf '%s' "$release_json" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' | head -n1)
          release_draft=$(printf '%s' "$release_json" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft' | head -n1)

          if [ -n "$release_id" ]; then
            if [ "$release_draft" != "true" ]; then
              echo "::error::Release $TAG already exists and is not a draft"
              exit 1
            fi

            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/releases/$release_id" \
              -f tag_name="$TAG" \
              -f target_commitish="$TARGET_SHA" \
              -f name="$TAG" \
              -F draft=true \
              -F prerelease=false \
              -F body=@release-notes.final.md >/dev/null

            echo "Updated existing draft $TAG"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file release-notes.final.md \
              --draft

            echo "Created draft $TAG"
          fi
