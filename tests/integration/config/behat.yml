default:
  autoload:
    '': '%paths.base%/../features/bootstrap'
  suites:
    default:
      contexts:
        - LibreSign\Behat\MailpitExtension\Context\MailpitContext
        - FeatureContext
      paths:
        - '%paths.base%/../features'

  extensions:
    LibreSign\Behat\MailpitExtension\ServiceContainer\MailpitExtension:
      base_url: http://mailpit:8025
    PhpBuiltin\Server:
      runAs: www-data
      # Keep the minimum workers needed for occasional nested HTTP to the same
      # PHP built-in server (single-process deadlocks on self-requests). Prefer
      # inline <PDF_BASE64> fixtures over url→/develop/pdf to avoid load-driven
      # cURL 52 flakes from higher PHP_CLI_SERVER_WORKERS values.
      workers: 2
    jarnaiz\JUnitFormatter\JUnitFormatterExtension:
      filename: report.xml
      outputDir: '%paths.base%/../output/'
    LibreSign\Behat\TsaExtension\ServiceContainer\TsaExtension: ~
