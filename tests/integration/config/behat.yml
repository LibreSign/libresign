default:
  autoload:
    '': '%paths.base%/../features/bootstrap'
  suites:
    default:
      contexts:
        - LibreSign\Behat\MailpitExtension\Context\MailpitContext
        - FeatureContext
      paths:
        - '%paths.base%/../features'

  extensions:
    LibreSign\Behat\MailpitExtension\ServiceContainer\MailpitExtension:
      base_url: http://mailpit:8025
    PhpBuiltin\Server:
      runAs: www-data
      # Keep single-process built-in server. Multi-worker (PHP_CLI_SERVER_WORKERS)
      # is experimental and flakes with cURL 52 under Behat load. Fixtures use
      # inline <PDF_BASE64> instead of nested HTTP to /develop/pdf.
      workers: 0
    jarnaiz\JUnitFormatter\JUnitFormatterExtension:
      filename: report.xml
      outputDir: '%paths.base%/../output/'
    LibreSign\Behat\TsaExtension\ServiceContainer\TsaExtension: ~
